services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:latest
    container_name: bambuddy
    networks:
      - bambuddy
    ports:
      - "${PORT:-8000}:8000"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs
    environment:
      - TZ=${TZ:-America/Los_Angeles}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=${PORT:-8000}
      - DATABASE_URL=postgresql+asyncpg://bambuddy:changeme@postgres:5432/bambuddy
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: bambuddy-db
    networks:
      - bambuddy
    environment:
      POSTGRES_USER: bambuddy
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: bambuddy
    volumes:
      - bambuddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bambuddy -d bambuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  bambuddy:

volumes:
  bambuddy_data:
  bambuddy_logs:
  bambuddy_pgdata:
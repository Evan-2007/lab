name: split-pro-prod

services:
  postgres:
    image: ossapps/postgres:18.3-trixie
    container_name: ${POSTGRES_CONTAINER_NAME:-splitpro-db}
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:?err}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${POSTGRES_DB:-splitpro}
      -c cron.timezone=${RECURRENCE_TIME_ZONE:-UTC}
    # ports:
    #   - "5432:5432"
    env_file: .env
    volumes:
      - split_database:/var/lib/postgresql/data

  splitpro:
    image: ossapps/splitpro:latest
    container_name: splitpro
    restart: always
    ports:
      - ${PORT:-8086}:${PORT:-3000}
    environment:
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0

      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:?err}:${POSTGRES_PASSWORD:?err}@${POSTGRES_CONTAINER_NAME:-splitpro-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?err}

      # Next Auth (generate secret with: openssl rand -base64 32)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?err}
      - NEXTAUTH_URL=${NEXTAUTH_URL:?err}
      - NEXTAUTH_URL_INTERNAL=${NEXTAUTH_URL_INTERNAL:-http://localhost:3000}

      # App behaviour
      - DEFAULT_HOMEPAGE=${DEFAULT_HOMEPAGE:-/home}
      - ENABLE_SENDING_INVITES=${ENABLE_SENDING_INVITES:-false}
      - ENABLE_USER_DISCOVERY=${ENABLE_USER_DISCOVERY:-false}
      - DISABLE_EMAIL_SIGNUP=${DISABLE_EMAIL_SIGNUP:-false}
      - EXCLUDE_FUTURE_EXPENSES=${EXCLUDE_FUTURE_EXPENSES:-false}
      - OAUTH_AUTO_REDIRECT=${OAUTH_AUTO_REDIRECT:-false}
      - CURRENCY_RATE_PROVIDER=${CURRENCY_RATE_PROVIDER:-frankfurter}
      - UPLOAD_MAX_FILE_SIZE_MB=${UPLOAD_MAX_FILE_SIZE_MB:-10}

      # Cron / recurrence (time is in PostgreSQL's cron.timezone)
      - RECURRENCE_TIME=${RECURRENCE_TIME:-00:00}
      - CLEAR_CACHE_CRON_RULE=${CLEAR_CACHE_CRON_RULE:-0 2 * * 0}
      - CACHE_RETENTION_INTERVAL=${CACHE_RETENTION_INTERVAL:-2 days}

      # Auth: email magic link / OTP via SMTP
      - FROM_EMAIL=${FROM_EMAIL:?err}
      - EMAIL_SERVER_HOST=${EMAIL_SERVER_HOST:?err}
      - EMAIL_SERVER_PORT=${EMAIL_SERVER_PORT:-587}
      - EMAIL_SERVER_USER=${EMAIL_SERVER_USER:?err}
      - EMAIL_SERVER_PASSWORD=${EMAIL_SERVER_PASSWORD:?err}
      - EMAIL_TLS_REJECT_UNAUTHORIZED=${EMAIL_TLS_REJECT_UNAUTHORIZED:-1}

      # Optional integrations (OAuth/OIDC providers, web push, GoCardless, Plaid, etc.)
      # are left out here so empty values don't fail schema validation —
      # set them in the Komodo stack environment and they arrive via .env.
    env_file: .env
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:${PORT:-3000}/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - split_uploads:/app/uploads

volumes:
  split_database:
  split_uploads:
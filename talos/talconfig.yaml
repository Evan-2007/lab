clusterName: homelab
kubernetesVersion: v1.36.1
endpoint: https://192.168.20.10:6443


cniConfig:
  name: none

controlPlane:
  patches:
    - |-
      cluster:
        allowSchedulingOnControlPlanes: true
        proxy:
          disabled: true
      machine:
        kubelet:
          extraMounts:
          - destination: /etc/iscsi
            type: bind
            source: /etc/iscsi
            options: [bind, rshared, rw]
          - destination: /var/lib/iscsi
            type: bind
            source: /var/lib/iscsi
            options: [bind, rshared, rw]
    - |-
      cluster:
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
  talosImageURL: factory.talos.dev/metal-installer/36cd6536eaec8ba802be2d38974108359069cedba8857302f69792b26b87c010



nodes:
  - hostname: cp1
    controlPlane: true
    ipAddress: 192.168.20.10
    installDisk: /dev/sdb
  - hostname: cp2
    controlPlane: true
    ipAddress: 192.168.20.11
    installDisk: /dev/sdb
  - hostname: cp3
    controlPlane: true
    ipAddress: 192.168.20.12
    installDisk: /dev/sdb

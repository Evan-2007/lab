---
apiVersion: v1
kind: Service
metadata:
  name: technitium-dns
  namespace: technitium
  annotations:
    io.cilium/lb-ipam-ips: "${TECHNITIUM_LB_IP}"
spec:
  type: LoadBalancer
  selector:
    app: technitium
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-web
  namespace: technitium
spec:
  type: ClusterIP
  selector:
    app: technitium
  ports:
    - { name: http, port: 5380, targetPort: http }
---
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: grafana
  namespace: monitoring
spec:
  name: Grafana
  description: "Grafana dashboards"
  callbackUrls:
    - https://grafana.${DOMAIN_PUBLIC}/login/generic_oauth
    - http://grafana.${DOMAIN_LOCAL}/login/generic_oauth
  logoutCallbackUrls:
    - https://grafana.${DOMAIN_PUBLIC}/logout
    - http://grafana.${DOMAIN_LOCAL}/logout
  pkceEnabled: true
  # skipConsent: true
  secret:
    enabled: true
    name: grafana-oidc
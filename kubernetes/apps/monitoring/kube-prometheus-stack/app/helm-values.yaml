kubeProxy:
  enabled: false


kubeEtcd:
  enabled: true
  endpoints:
    - 192.168.20.10
    - 192.168.20.11
    - 192.168.20.12

prometheus:
  prometheusSpec:
    retention: 10d
    retentionSize: 18GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 1Gi}
      limits: {memory: 3Gi}

grafana:
  admin:
    existingSecret: grafana-admin     
  persistence:
    enabled: true                     
    storageClassName: truenas-iscsi
    accessModes: [ReadWriteOnce]
    size: 5Gi
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef: {name: grafana-oidc, key: client_id}
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef: {name: grafana-oidc, key: client_secret}
    GF_AUTH_GENERIC_OAUTH_AUTH_URL:
      secretKeyRef: {name: grafana-oidc, key: authorization_url}
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL:
      secretKeyRef: {name: grafana-oidc, key: token_url}
    GF_AUTH_GENERIC_OAUTH_API_URL:
      secretKeyRef: {name: grafana-oidc, key: userinfo_url}
  grafana.ini:
    server:
      root_url: https://grafana.${DOMAIN_PUBLIC}
    auth.generic_oauth:
      enabled: true
      auto_login: true
      name: Pocket ID
      allow_sign_up: true
      use_pkce: true
      scopes: "openid profile email groups"
      role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
    auth: 
      disable_login_form: true
    auth.basic: 
      enabled: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: truenas-iscsi
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
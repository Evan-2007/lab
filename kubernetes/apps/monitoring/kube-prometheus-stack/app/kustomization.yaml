---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
  - ingressroute.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: kps-helm-values
    namespace: monitoring
    files:
      - values.yaml=helm-values.yaml

generatorOptions:
  disableNameSuffixHash: true


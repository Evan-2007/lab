---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  - helmrelease.yaml


configMapGenerator:
  - name: democratic-csi-values
    namespace: democratic-csi
    files:
      - values.yaml=helm-values.yaml

generatorOptions:
  disableNameSuffixHash: true

---
apiVersion: v1
kind: Service
metadata:
  name: books-external
  namespace: traefik
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 3008
      targetPort: 3008
---
apiVersion: v1
kind: Endpoints
metadata:
  name: books-external
  namespace: traefik
subsets:
  - addresses:
      - ip: ${DOCKER_HOST_IP}
    ports:
      - name: web
        port: 3008
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: books-external
  namespace: traefik
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`books.${DOMAIN_PUBLIC}`)
      kind: Rule
      services:
        - name: books-external
          port: 3008
  tls: {}
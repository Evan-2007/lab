---
apiVersion: v1
kind: Service
metadata:
  name: komodo-external
  namespace: traefik
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9120
      targetPort: 9120
---
apiVersion: v1
kind: Endpoints
metadata:
  name: komodo-external
  namespace: traefik
subsets:
  - addresses:
      - ip: ${DOCKER_HOST_IP}
    ports:
      - name: web
        port: 9120
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: komodo-external
  namespace: traefik
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`komodo.${DOMAIN_PUBLIC}`)
      kind: Rule
      services:
        - name: komodo-external
          port: 9120
  tls: {}
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: traefik-helm-values
    namespace: traefik
    files:
      - values.yaml=helm-values.yaml

generatorOptions:
  disableNameSuffixHash: true


---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: technitium
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/network/technitium/app
  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: democratic-csi
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings

  decryption:
    provider: sops
    secretRef:
      name: sops-age
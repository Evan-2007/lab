---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  path: ./kubernetes/apps/monitoring/kube-prometheus-stack/app
  sourceRef:
    kind: GitRepository
    name: flux-system

  dependsOn:
    - name: democratic-csi
    - name: traefik
  prune: true
  wait: true
  timeout: 20m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  decryption:
    provider: sops
    secretRef:
      name: sops-age